<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#227960">
  <meta name="description" content="문서, 일정, 할 일을 한곳에서. 나의 하루를 정리하는 ONDO 오피스.">
  <title>ONDO — 나의 업무 오피스</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard" aria-label="ONDO 홈"><span class="brand-symbol">o<span></span></span><strong>ondo<span>office</span></strong></a>
    <div class="workspace"><span class="workspace-avatar">M</span><div><strong>나의 워크스페이스</strong><small>Personal workspace</small></div><span class="workspace-dot"></span></div>
    <p class="nav-label">WORKSPACE</p>
    <nav aria-label="주 메뉴">
      <a href="#dashboard" data-page="dashboard"><i data-icon="grid"></i>대시보드</a>
      <a href="#tasks" data-page="tasks"><i data-icon="check"></i>할 일<span id="nav-task-count" class="nav-count"></span></a>
      <a href="#calendar" data-page="calendar"><i data-icon="calendar"></i>일정</a>
      <a href="#documents" data-page="documents"><i data-icon="file"></i>문서</a>
    </nav>
    <div class="sidebar-divider"></div>
    <p class="nav-label">QUICK TOOLS</p>
    <button class="assistant-nav" data-action="briefing"><i data-icon="clock"></i>오늘의 업무 브리핑</button><button class="assistant-nav" data-action="import"><i data-icon="file"></i>백업 가져오기</button>
    <div class="sidebar-bottom"><div class="local-note"><span class="status-dot"></span><strong>나만의 작은 오피스</strong><p>데이터는 이 브라우저에 저장돼요.</p><button data-action="export">데이터 백업 <span>↗</span></button></div><div class="profile"><span class="avatar">나</span><div><strong>나의 계정</strong><small>개인 워크스페이스</small></div><button class="icon-button" data-action="settings" aria-label="워크스페이스 정보"><i data-icon="settings"></i></button></div></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb">워크스페이스 <span>/</span> <strong id="breadcrumb-title">대시보드</strong></div><div class="topbar-actions"><label class="search-box"><i data-icon="search"></i><input id="global-search" type="search" placeholder="문서, 할 일 검색" aria-label="문서, 할 일 검색"><kbd>/</kbd></label><button class="icon-button" data-action="notifications" aria-label="다가오는 일정"><i data-icon="bell"></i><span id="notification-dot"></span></button><span class="avatar top-avatar">나</span></div></header>
    <main id="main" tabindex="-1"></main>
    <footer>조금 더 가볍게, 조금 더 나답게. <span>Made for your flow · ONDO</span></footer>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
  <input id="backup-file" type="file" accept="application/json,.json" hidden aria-label="백업 파일 가져오기">
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
